version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcp_poc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Backend FastAPI Service
  backend:
    build: .
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mcp_poc
    ports:
      - "8000:8000"
    command: >
      sh -c "
        echo 'Waiting for PostgreSQL to be ready...' &&
        sleep 5 &&
        uvicorn backend.main:app --host 0.0.0.0 --port 8000
      "

  # Agent Service (disabled by default)
  # Uncomment to enable
  # agent:
  #   build:
  #     context: .
  #     dockerfile: agent.Dockerfile
  #   depends_on:
  #     - backend
  #   environment:
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #     - MCP_SERVER_URL=http://backend:8000/mcp

volumes:
  postgres_data:
